name: Build Knockback Displacement

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Find mod project
        id: project
        run: |
          PROJECT_DIR=$(dirname "$(find . -name gradle.properties -not -path '*/.gradle/*' -print -quit)")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build mod
        run: gradle --no-daemon -p "${{ steps.project.outputs.dir }}" clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: knockback-displacement-1.21.11
          path: ${{ steps.project.outputs.dir }}/build/libs/*[!.sources].jar
          if-no-files-found: error
